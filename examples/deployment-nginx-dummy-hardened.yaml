apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-with-dummy-init
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-with-dummy-init
  template:
    metadata:
      labels:
        app: nginx-with-dummy-init
    spec:
      # Pod-level: restrict host access
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: init
          image: ghcr.io/tarampampam/curl:8.7.1
          command: ["curl", "--version"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      containers:
        - name: nginx
          image: ghcr.io/nginxinc/nginx-unprivileged:1.25
          ports:
            - containerPort: 8080   # unprivileged nginx binds to 8080, not 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101    # the nginx unprivileged image uses UID 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # nginx needs a few writable paths at runtime even with a read-only root fs
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
